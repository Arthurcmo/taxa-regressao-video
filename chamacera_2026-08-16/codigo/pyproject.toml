[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chamacera"
version = "0.1.0"
description = "Detecção, rotulagem automática e medição de chama/parafina em slab burner de propulsão híbrida"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "torch>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
sam2 = ["sam2 @ git+https://github.com/facebookresearch/sam2.git"]
sam3 = ["ultralytics>=8.3"]
dev = ["pytest>=7.4"]

[project.scripts]
chamacera = "chamacera.cli:main"

[tool.setuptools.packages.find]
include = ["chamacera*"]
